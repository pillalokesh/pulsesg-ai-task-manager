server:
  port: 8080
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulsesg}
    username: ${DB_USERNAME:pulsesg}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-value}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
