server { listen 80; server_name _; root /usr/share/nginx/html; location /support/api/ { proxy_pass http://backend:8080/support/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; } location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; } location /support/ { rewrite ^/support/(.*)$ /$1 break; try_files $uri $uri/ /index.html; } location / { try_files $uri $uri/ /index.html; } }
