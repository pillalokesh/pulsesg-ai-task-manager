services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsesg
      POSTGRES_USER: ${DB_USERNAME:-pulsesg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: [pulsesg-db:/var/lib/postgresql/data]
    networks: [pulsesg]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME:-pulsesg}:${DB_PASSWORD:-change-me}@postgres:5432/pulsesg
      DB_USERNAME: ${DB_USERNAME:-pulsesg}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-long-value}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
      APP_CONTEXT_PATH: /support
      DB_CREATE_SCHEMA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      pulsesg:
        aliases: [pulsesg-ai-task-manager-backend]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /support
        VITE_BASE_PATH: /support/
    environment:
      BACKEND_HOST: pulsesg-ai-task-manager-backend
      NGINX_ENVSUBST_FILTER: ^BACKEND_HOST$
    ports: ["80:80"]
    depends_on: [backend]
    networks: [pulsesg]
volumes: { pulsesg-db: }
networks:
  pulsesg: { driver: bridge }
