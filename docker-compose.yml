services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsesg
      POSTGRES_USER: ${DB_USERNAME:-pulsesg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: [pulsesg-db:/var/lib/postgresql/data]
    networks: [pulsesg]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pulsesg
      DB_USERNAME: ${DB_USERNAME:-pulsesg}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-long-value}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
    depends_on: [postgres]
    networks: [pulsesg]
  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [backend]
    networks: [pulsesg]
volumes: { pulsesg-db: }
networks: { pulsesg: { driver: bridge } }
